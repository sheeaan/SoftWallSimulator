name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    # Visual Studio 2022 with the v142 toolset is MSVC 19.29, the compiler the project is developed with.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -T v142

      - name: Build
        run: cmake --build build --config Release --parallel

      # The test program prints PASS or FAIL per test and exits with code 1 if any test fails.
      - name: Test
        run: .\build\bin\Release\SoftWallTests.exe
